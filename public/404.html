        --ink: #0A0A0A;
        --white: #FFFFFF;

        --line-dark: rgba(255, 255, 255, 0.16);

      body {

        display: flex; flex-direction: column;
        justify-content: center;
        padding: clamp(1.25rem, 4.5vw, 4.5rem);
        background: var(--ink); color: var(--white);

      .mark {

        font-family: var(--mono); font-size: 0.7rem; font-weight: 500;

      .back {

        margin-top: 2rem; padding-bottom: 0.3rem;
        color: var(--white); text-decoration: none; font-size: 0.95rem;
        border-bottom: 1px solid var(--line-dark);
        transition: border-color 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .back:hover { border-bottom-color: var(--white); }
      footer {
        padding-top: 1.5rem; border-top: 1px solid var(--line-dark);
        font-family: var(--mono); font-size: 0.66rem; font-weight: 500;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey-40);
